<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMARTMESS AI — AI-Based Food Waste Prediction & Reduction System</title>
  <meta name="description" content="AI-Based Food Waste Prediction and Reduction System for Hostels. Right Food. Right Quantity. A Smarter Mess." />

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="h-full flex flex-col antialiased selection:bg-emerald-500 selection:text-white">
  <!-- Sticky Top Navigation Bar -->
  <div id="top-bar-container"></div>

  <!-- Main Application Dynamic Mounting Container -->
  <main id="app-root" class="flex-1 overflow-x-hidden"></main>

  <!-- Modal Dialog Containers -->
  <div id="reason-modal-container" class="hidden"></div>
  <div id="edit-profile-modal-container" class="hidden"></div>
  <div id="edit-meal-modal-container" class="hidden"></div>
  <div id="ai-details-modal-container" class="hidden"></div>
  <div id="notif-modal-container" class="hidden"></div>

  <!-- Toast Notification Stack -->
  <div id="toast-container"></div>

  <!-- Application Bootstrap Module -->
  <script type="module">
    import { SmartMessApp } from './js/app.js';
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new SmartMessApp();
    });
  </script>
</body>
</html>
